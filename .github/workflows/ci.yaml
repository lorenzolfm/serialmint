name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request cancels the older run. A push to main does not, so each commit on
  # main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One job for each derivation, so the runners work in parallel. A single `nix flake check` puts
      # every gate behind one log and one runner.
      matrix:
        gate: [serialmint, serialmint-clippy, serialmint-test, serialmint-fmt, serialmint-deny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # flake.lock pins each tool, and rust-toolchain.toml pins the compiler. No installer step
      # chooses a different version.
      - run: nix build --print-build-logs ".#${{ matrix.gate }}"

      # Build the package and its dependencies a second time. Nix fails the step if an output is not
      # the same bytes. `--rebuild` does not rebuild inputs, so the dependencies are named on their
      # own.
      - if: matrix.gate == 'serialmint'
        run: nix build --print-build-logs --rebuild .#serialmint .#serialmint.cargoArtifacts

  # Runs each mutant on the lines that a pull request changes. A push has no such diff.
  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit. Depth 2 also gets the parents of that commit,
          # so the diff is what the merge adds to `main`.
          fetch-depth: 2

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pull-request.diff"
          nix develop --command cargo mutants --in-diff "$RUNNER_TEMP/pull-request.diff" --jobs 2
